name: Production Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent overlapping deployments to protect release integrity
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Production Deployment
        env:
          HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST || '217.21.91.171' }}
          HOSTINGER_SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT || '65002' }}
          HOSTINGER_SSH_USER: ${{ secrets.HOSTINGER_SSH_USER || 'u209772524' }}
          HOSTINGER_SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          node scripts/remote-deploy.mjs
