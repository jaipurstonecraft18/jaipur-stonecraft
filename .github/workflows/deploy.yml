name: Production Deployment to Hostinger

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent overlapping deployments to protect release integrity
concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Authentication & Pinned Known Hosts
        env:
          SSH_KEY: ${{ secrets.HOSTINGER_SSH_KEY }}
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          
          # Write deployment private key with strict LF formatting and permissions
          printf '%s\n' "$SSH_KEY" | tr -d '\r' > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          
          # Pin verified Hostinger ED25519 host key directly to eliminate MITM risk
          TARGET_HOST="${SSH_HOST:-217.21.91.171}"
          TARGET_PORT="${SSH_PORT:-65002}"
          echo "[$TARGET_HOST]:$TARGET_PORT ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIK5AsvHgeGrFgvZwdSBg+3ulOfljSLDNy+vup5bWc4zl" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Execute Production Deployment on Hostinger
        env:
          SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}
          SSH_PORT: ${{ secrets.HOSTINGER_SSH_PORT }}
          SSH_USER: ${{ secrets.HOSTINGER_SSH_USER }}
          TARGET_COMMIT: ${{ github.sha }}
        run: |
          TARGET_HOST="${SSH_HOST:-217.21.91.171}"
          TARGET_PORT="${SSH_PORT:-65002}"
          TARGET_USER="${SSH_USER:-u209772524}"
          
          echo "Connecting to Hostinger (${TARGET_USER}@${TARGET_HOST}:${TARGET_PORT}) to deploy commit ${TARGET_COMMIT}..."
          
          ssh -i ~/.ssh/deploy_key \
            -p "$TARGET_PORT" \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=accept-new \
            "${TARGET_USER}@${TARGET_HOST}" \
            "cd /home/u209772524/domains/lavenderblush-crab-850824.hostingersite.com/hbuilds/last-source && git fetch origin main && git reset --hard FETCH_HEAD && bash scripts/deploy-hostinger.sh '${TARGET_COMMIT}'"

      - name: Cleanup SSH Credentials
        if: always()
        run: |
          rm -f ~/.ssh/deploy_key
