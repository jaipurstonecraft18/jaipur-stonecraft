<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" fill="none">
  <defs>
    <!-- Ultra High-Definition Drop Shadow for pristine edge separation on any stone texture -->
    <filter id="ultraHdShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F7D89C" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA8222" />
    </linearGradient>
  </defs>

  <g filter="url(#ultraHdShadow)">
    <!-- 8-Pointed Sacred Stonecraft Star Emblem -->
    <g transform="translate(60, 40) scale(4.2)">
      <!-- Outer diamond star points -->
      <path d="M24 2 L30 18 L46 24 L30 30 L24 46 L18 30 L2 24 L18 18 Z" 
            fill="url(#goldGradient)" 
            stroke="#FFFFFF" 
            stroke-width="1.2" 
            stroke-linejoin="round" />
      
      <!-- Inner star facets -->
      <path d="M24 8 L27 19 L38 24 L27 29 L24 40 L21 29 L10 24 L21 19 Z" 
            fill="#FFFFFF" 
            fill-opacity="0.25" />

      <!-- Center Divine Bindu Circle -->
      <circle cx="24" cy="24" r="5" fill="#FFFFFF" stroke="#AA8222" stroke-width="0.8" />
    </g>

    <!-- Typography: JAIPUR STONECRAFT (Ultra-crisp lettering with dual outline for contrast on white/dark stone) -->
    <text x="290" y="145" 
          font-family="'Cinzel', 'Trajan Pro', 'Baskerville', 'Georgia', serif" 
          font-size="68" 
          font-weight="700" 
          letter-spacing="10" 
          fill="#FFFFFF" 
          stroke="#0A0908" 
          stroke-width="2.5" 
          paint-order="stroke fill">
      JAIPUR STONECRAFT
    </text>

    <!-- Secondary Line: ATELIER OF SACRED STONE ART -->
    <text x="294" y="200" 
          font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" 
          font-size="26" 
          font-weight="600" 
          letter-spacing="7" 
          fill="url(#goldGradient)" 
          stroke="#0A0908" 
          stroke-width="1" 
          paint-order="stroke fill">
      ATELIER OF SACRED STONE ART
    </text>
  </g>
</svg>
